<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ASVIRO AIRSKETCH — Smart Shape AI Edition</title>
  <style>
    :root {
      --bg-void: #030712;
      --glass: rgba(7, 16, 36, 0.78);
      --glass-strong: rgba(5, 12, 28, 0.94);
      --border-cyan: rgba(0, 229, 255, 0.3);
      --border-soft: rgba(148, 163, 184, 0.16);
      --cyan: #00e5ff;
      --cyan-dim: rgba(0, 229, 255, 0.14);
      --blue: #2563eb;
      --emerald: #10b981;
      --amber: #f59e0b;
      --crimson: #ff3b5c;
      --text: #f0f9ff;
      --muted: rgba(186, 230, 253, 0.75);
      --font-ui: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --shadow-hud: 0 16px 40px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(0, 229, 255, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-void); color: var(--text); font-family: var(--font-ui); }

    .workspace {
      position: relative; width: 100vw; height: 100vh; overflow: hidden;
      background: radial-gradient(circle at 50% 45%, rgba(0, 229, 255, 0.1), transparent 55%),
                  radial-gradient(circle at 15% 15%, #0c1b3a 0%, var(--bg-void) 72%);
    }

    #webcam {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1); z-index: 1;
      filter: contrast(1.12) saturate(1.2) brightness(1.04);
      transition: opacity 0.25s ease, filter 0.25s ease;
    }
    #webcam.dimmed { opacity: 0.25; filter: saturate(0.45) contrast(1.1); }
    #webcam.hidden-feed { opacity: 0; }

    #drawCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; touch-action: none; cursor: crosshair; }
    #overlayCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

    .hud-grid {
      position: absolute; inset: 0; z-index: 4; pointer-events: none;
      background-image: linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, transparent 48%, black 100%);
      -webkit-mask-image: radial-gradient(circle at center, transparent 48%, black 100%);
    }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid var(--border-cyan);
      box-shadow: var(--shadow-hud);
    }

    .air-hover {
      outline: 2px solid var(--cyan) !important;
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.55) !important;
      transform: scale(1.04);
    }

    /* Top HUD */
    .top-hud {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      pointer-events: none; flex-wrap: wrap;
    }
    .top-hud > * { pointer-events: auto; }

    .brand-cluster { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 8px; border-radius: 999px; }
    .arc-core {
      width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; position: relative;
      background: radial-gradient(circle, rgba(0,229,255,0.34), rgba(37,99,235,0.22));
      border: 1.5px solid var(--cyan); box-shadow: 0 0 16px rgba(0,229,255,0.38);
    }
    .brand-meta h1 { font-size: 0.82rem; font-weight: 800; letter-spacing: 0.08em; }
    .brand-sub { font-size: 0.6rem; letter-spacing: 0.06em; color: var(--cyan); }

    .telemetry-strip { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-size: 0.72rem; }
    .tel-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .tel-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 8px var(--amber); }
    .tel-dot.online { background: var(--emerald); box-shadow: 0 0 9px var(--emerald); }
    .tel-dot.active { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
    .tel-dot.erase { background: var(--crimson); box-shadow: 0 0 10px var(--crimson); }

    .hud-actions { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; }
    .hud-btn {
      appearance: none; border: 1px solid transparent; background: transparent; color: var(--text);
      height: 30px; min-width: 30px; padding: 0 8px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: 0.15s ease;
    }
    .hud-btn:hover:not(:disabled) { background: rgba(0,229,255,0.14); border-color: rgba(0,229,255,0.35); }
    .hud-btn:disabled { opacity: 0.32; cursor: not-allowed; }
    .hud-btn.active { background: rgba(0,229,255,0.22); border-color: var(--cyan); color: var(--cyan); }
    .hud-btn.danger:hover:not(:disabled) { background: rgba(255,59,92,0.2); border-color: rgba(255,59,92,0.5); color: #fda4af; }
    .hud-btn.primary { background: linear-gradient(135deg, rgba(0,229,255,0.25), rgba(37,99,235,0.3)); border-color: rgba(0,229,255,0.45); }

    /* Bottom Command Dock */
    .bottom-dock-wrap { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 20; max-width: calc(100vw - 16px); }
    .bottom-dock { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 22px; flex-wrap: wrap; justify-content: center; }
    .dock-sep { width: 1px; height: 22px; background: var(--border-soft); }

    .mode-group { display: flex; padding: 3px; border-radius: 999px; background: rgba(0,0,0,0.36); border: 1px solid var(--border-soft); gap: 4px; }
    .mode-pill {
      appearance: none; border: none; background: transparent; color: var(--muted);
      padding: 5px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.16s ease;
    }
    .mode-pill.active[data-tool="brush"] { background: linear-gradient(135deg, #00e5ff, #2563eb); color: #030712; box-shadow: 0 0 14px rgba(0,229,255,0.4); }
    .mode-pill.active[data-tool="eraser"] { background: linear-gradient(135deg, #ff3b5c, #e11d48); color: #fff; box-shadow: 0 0 14px rgba(255,59,92,0.4); }

    .swatches { display: flex; align-items: center; gap: 6px; }
    .swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.25); cursor: pointer; transition: 0.14s ease; }
    .swatch.active { transform: scale(1.18); border-color: #fff; box-shadow: 0 0 10px currentColor; }

    .color-custom {
      position: relative; width: 22px; height: 22px; border-radius: 50%; padding: 2px;
      background: conic-gradient(#ff3b5c, #f59e0b, #10b981, #00e5ff, #a855f7, #ff3b5c);
      cursor: pointer; display: grid; place-items: center;
    }
    .color-custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .color-custom-dot { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #040812; pointer-events: none; }

    .slider-group { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--muted); }
    input[type="range"].cyber-range {
      -webkit-appearance: none; appearance: none; width: 70px; height: 4px; border-radius: 99px;
      background: rgba(0,229,255,0.22); outline: none; cursor: pointer;
    }
    input[type="range"].cyber-range::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: var(--cyan); border: 2px solid #fff; box-shadow: 0 0 8px rgba(0,229,255,0.7); cursor: pointer;
    }

    .floating-panel {
      position: fixed; z-index: 30; border-radius: 20px; padding: 16px;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    }
    .floating-panel.hidden { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(12px) scale(0.96); }

    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border-soft); }
    .panel-title { font-size: 0.8rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan); }

    .controls-panel {
      top: 64px; right: 12px; width: 300px; max-width: calc(100vw - 24px); max-height: calc(100vh - 100px); overflow-y: auto;
    }
    @media (max-width: 640px) {
      .controls-panel { top: auto; bottom: 70px; right: 12px; left: 12px; width: auto; max-height: 55vh; }
    }

    .control-row { margin-bottom: 10px; }
    .control-label { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
    .seg-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .seg-btn {
      appearance: none; border: 1px solid var(--border-soft); background: rgba(255,255,255,0.04);
      color: var(--muted); padding: 6px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; cursor: pointer; text-align: center;
    }
    .seg-btn.active { background: rgba(0,229,255,0.18); border-color: var(--cyan); color: var(--cyan); }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 45; background: rgba(2,6,18,0.78);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      display: grid; place-items: center; padding: 16px;
    }
    .modal-backdrop.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .startup-card { width: 100%; max-width: 460px; border-radius: 24px; padding: 22px; background: var(--glass-strong); text-align: center; }
    .start-cta {
      width: 100%; padding: 12px; border-radius: 999px; border: none;
      background: linear-gradient(135deg, #00e5ff, #2563eb); color: #030712; font-size: 0.88rem;
      font-weight: 800; cursor: pointer; box-shadow: 0 10px 24px rgba(0,229,255,0.36); margin-top: 10px;
    }

    .toast {
      position: fixed; top: 62px; left: 50%; transform: translateX(-50%) translateY(-8px); z-index: 60;
      padding: 6px 14px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; color: var(--cyan);
      opacity: 0; pointer-events: none; transition: 0.2s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="workspace">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="drawCanvas"></canvas>
    <canvas id="overlayCanvas"></canvas>
    <div class="hud-grid"></div>
  </div>

  <!-- Top HUD -->
  <header class="top-hud">
    <div class="brand-cluster glass">
      <div class="arc-core">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2.4">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
        </svg>
      </div>
      <div class="brand-meta">
        <h1>ASVIRO AIRSKETCH</h1>
        <div class="brand-sub">SMART SHAPE EDITION</div>
      </div>
    </div>

    <div class="telemetry-strip glass">
      <div class="tel-item"><span class="tel-dot" id="statusDot"></span><span id="camStatusText">STANDBY</span></div>
      <span style="font-family:var(--font-mono); font-size:0.68rem; color:var(--cyan);" id="gestureBadge">NO HAND</span>
    </div>

    <div class="hud-actions glass">
      <button class="hud-btn" id="undoBtn" disabled>Undo</button>
      <button class="hud-btn active" id="smartShapeBtn" title="Auto Shape Snap">Smart Shape</button>
      <button class="hud-btn" id="controlsToggleBtn">Panel</button>
      <button class="hud-btn danger" id="clearBtn">Clear</button>
      <button class="hud-btn primary" id="exportBtn">Export</button>
    </div>
  </header>

  <div class="toast glass" id="toast"></div>

  <!-- Bottom Command Dock -->
  <div class="bottom-dock-wrap">
    <div class="bottom-dock glass">
      <div class="mode-group">
        <button class="mode-pill active" id="brushBtn" data-tool="brush">Brush</button>
        <button class="mode-pill" id="eraserBtn" data-tool="eraser">Eraser</button>
      </div>
      <div class="dock-sep"></div>
      <div class="swatches">
        <button class="swatch active" data-color="#00e5ff" style="background:#00e5ff;"></button>
        <button class="swatch" data-color="#3b82f6" style="background:#3b82f6;"></button>
        <button class="swatch" data-color="#10b981" style="background:#10b981;"></button>
        <button class="swatch" data-color="#f59e0b" style="background:#f59e0b;"></button>
        <button class="swatch" data-color="#ff3b5c" style="background:#ff3b5c;"></button>
        <label class="color-custom" title="Custom Color">
          <div class="color-custom-dot" id="customColorDot" style="background:#00e5ff;"></div>
          <input type="color" id="customColorInput" value="#00e5ff" />
        </label>
      </div>
      <div class="dock-sep"></div>
      <div class="slider-group">
        <input type="range" class="cyber-range" id="sizeSlider" min="2" max="42" value="9" />
      </div>
    </div>
  </div>

  <!-- Controls Panel -->
  <aside class="floating-panel controls-panel glass hidden" id="controlsPanel">
    <div class="panel-head">
      <div class="panel-title">Settings &amp; AI</div>
      <button class="hud-btn" id="closeControlsBtn">✕</button>
    </div>
    <div class="control-row">
      <div class="control-label"><span>Camera Glow Filter</span></div>
      <div class="seg-group">
        <button class="seg-btn active" id="glowOnBtn">HDR Glow</button>
        <button class="seg-btn" id="glowOffBtn">Standard</button>
      </div>
    </div>
    <div class="control-row">
      <div class="control-label"><span>Smart Shape Snap</span></div>
      <div class="seg-group">
        <button class="seg-btn active" id="snapOnBtn">Enabled</button>
        <button class="seg-btn" id="snapOffBtn">Disabled</button>
      </div>
    </div>
  </aside>

  <!-- Startup Modal -->
  <div class="modal-backdrop" id="startupModal">
    <div class="startup-card glass">
      <h2>ASVIRO AIRSKETCH</h2>
      <p style="font-size:0.78rem; color:var(--muted); margin:10px 0 16px;">
        Air Drawing with AI Hand Tracking, Camera Glow, &amp; Smart Shape Recognition.
      </p>
      <button class="start-cta" id="startCamBtn">Launch Camera &amp; AI</button>
    </div>
  </div>

  <script type="module">
    import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const $ = (id) => document.getElementById(id);
    const video = $("webcam");
    const drawCanvas = $("drawCanvas");
    const overlayCanvas = $("overlayCanvas");
    const drawCtx = drawCanvas.getContext("2d", { willReadFrequently: true });
    const overlayCtx = overlayCanvas.getContext("2d");

    let prefs = { brushSize: 9, eraserSize: 26, color: "#00e5ff", smartShape: true };
    let app = { tool: "brush", isDrawing: false, strokePts: [], undoStack: [], cameraActive: false, handLandmarker: null };

    function resizeCanvases() {
      const w = window.innerWidth, h = window.innerHeight;
      let snap = drawCanvas.width > 0 ? drawCanvas : null;
      drawCanvas.width = w; drawCanvas.height = h;
      overlayCanvas.width = w; overlayCanvas.height = h;
    }
    window.addEventListener("resize", resizeCanvases);
    resizeCanvases();

    function showToast(msg) {
      const el = $("toast");
      el.textContent = msg; el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1500);
    }

    function pushHistory() {
      app.undoStack.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
      if (app.undoStack.length > 20) app.undoStack.shift();
      $("undoBtn").disabled = false;
    }

    function performUndo() {
      if (!app.undoStack.length) return;
      drawCtx.putImageData(app.undoStack.pop(), 0, 0);
      if (!app.undoStack.length) $("undoBtn").disabled = true;
      showToast("Undo Applied");
    }

    // Smart Shape Recognition & Snapping Algorithm
    function recognizeAndSnapShape(pts) {
      if (!prefs.smartShape || pts.length < 12) return false;

      const start = pts[0];
      const end = pts[pts.length - 1];
      const totalDist = Math.hypot(end.x - start.x, end.y - start.y);

      // 1. Check for Circle (Start and end points are close together - closed loop)
      if (totalDist < 45) {
        let cx = 0, cy = 0;
        for (let i = 0; i < pts.length; i++) { cx += pts[i].x; cy += pts[i].y; }
        cx /= pts.length; cy /= pts.length;

        let avgRadius = 0;
        for (let i = 0; i < pts.length; i++) { avgRadius += Math.hypot(pts[i].x - cx, pts[i].y - cy); }
        avgRadius /= pts.length;

        let maxDev = 0;
        for (let i = 0; i < pts.length; i++) {
          const d = Math.abs(Math.hypot(pts[i].x - cx, pts[i].y - cy) - avgRadius);
          if (d > maxDev) maxDev = d;
        }

        // If deviation from average radius is low, it's a circle!
        if (maxDev < avgRadius * 0.35 && avgRadius > 12) {
          drawCtx.beginPath();
          drawCtx.arc(cx, cy, avgRadius, 0, Math.PI * 2);
          drawCtx.lineWidth = prefs.brushSize;
          drawCtx.strokeStyle = prefs.color;
          drawCtx.shadowColor = prefs.color;
          drawCtx.shadowBlur = 8;
          drawCtx.stroke();
          showToast("✨ Smart Shape: Perfect Circle");
          return true;
        }
      }

      // 2. Check for Straight Line (Points stay very close to the line connecting start and end)
      let maxLineDev = 0;
      const lineLen = Math.hypot(end.x - start.x, end.y - start.y);
      if (lineLen > 50) {
        for (let i = 1; i < pts.length - 1; i++) {
          const p = pts[i];
          // Perpendicular distance from point to line segment
          const num = Math.abs((end.y - start.y) * p.x - (end.x - start.x) * p.y + end.x * start.y - end.y * start.x);
          const dev = num / lineLen;
          if (dev > maxLineDev) maxLineDev = dev;
        }

        if (maxLineDev < 14) {
          drawCtx.beginPath();
          drawCtx.moveTo(start.x, start.y);
          drawCtx.lineTo(end.x, end.y);
          drawCtx.lineCap = "round";
          drawCtx.lineWidth = prefs.brushSize;
          drawCtx.strokeStyle = prefs.color;
          drawCtx.shadowColor = prefs.color;
          drawCtx.shadowBlur = 8;
          drawCtx.stroke();
          showToast("✨ Smart Shape: Straight Line");
          return true;
        }
      }

      return false;
    }

    // Touch & Mouse Drawing Fallback with Shape Snapping
    drawCanvas.addEventListener("pointerdown", (e) => {
      drawCanvas.setPointerCapture(e.pointerId);
      pushHistory();
      app.isDrawing = true;
      app.strokePts = [{ x: e.clientX, y: e.clientY }];
    });

    drawCanvas.addEventListener("pointermove", (e) => {
      if (!app.isDrawing) return;
      app.strokePts.push({ x: e.clientX, y: e.clientY });
      drawCtx.save();
      drawCtx.lineCap = "round"; drawCtx.lineJoin = "round";
      drawCtx.lineWidth = app.tool === "brush" ? prefs.brushSize : prefs.eraserSize;
      if (app.tool === "eraser") {
        drawCtx.globalCompositeOperation = "destination-out";
        drawCtx.strokeStyle = "rgba(0,0,0,1)";
      } else {
        drawCtx.globalCompositeOperation = "source-over";
        drawCtx.strokeStyle = prefs.color;
        drawCtx.shadowColor = prefs.color; drawCtx.shadowBlur = 6;
      }
      const pts = app.strokePts;
      if (pts.length >= 2) {
        drawCtx.beginPath();
        drawCtx.moveTo(pts[pts.length - 2].x, pts[pts.length - 2].y);
        drawCtx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
        drawCtx.stroke();
      }
      drawCtx.restore();
    });

    const stopDraw = () => {
      if (!app.isDrawing) return;
      app.isDrawing = false;
      if (app.tool === "brush" && prefs.smartShape && app.strokePts.length > 5) {
        // Temporarily undo the rough stroke and snap to shape
        drawCtx.putImageData(app.undoStack[app.undoStack.length - 1], 0, 0);
        const snapped = recognizeAndSnapShape(app.strokePts);
        if (!snapped) {
          // Redraw original rough stroke if no shape matched
          drawCtx.save();
          drawCtx.lineCap = "round"; drawCtx.lineJoin = "round";
          drawCtx.lineWidth = prefs.brushSize;
          drawCtx.strokeStyle = prefs.color;
          drawCtx.shadowColor = prefs.color; drawCtx.shadowBlur = 6;
          drawCtx.beginPath();
          drawCtx.moveTo(app.strokePts[0].x, app.strokePts[0].y);
          for (let i = 1; i < app.strokePts.length; i++) drawCtx.lineTo(app.strokePts[i].x, app.strokePts[i].y);
          drawCtx.stroke();
          drawCtx.restore();
        }
      }
      app.strokePts = [];
    };

    drawCanvas.addEventListener("pointerup", stopDraw);

    // UI & Control Handlers
    $("brushBtn").addEventListener("click", () => { app.tool = "brush"; $("brushBtn").classList.add("active"); $("eraserBtn").classList.remove("active"); });
    $("eraserBtn").addEventListener("click", () => { app.tool = "eraser"; $("eraserBtn").classList.add("active"); $("brushBtn").classList.remove("active"); });
    $("undoBtn").addEventListener("click", performUndo);
    $("controlsToggleBtn").addEventListener("click", () => $("controlsPanel").classList.toggle("hidden"));
    $("closeControlsBtn").addEventListener("click", () => $("controlsPanel").classList.add("hidden"));
    $("clearBtn").addEventListener("click", () => { pushHistory(); drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); showToast("Canvas Cleared"); });

    document.querySelectorAll(".swatch").forEach(sw => {
      sw.addEventListener("click", () => {
        prefs.color = sw.dataset.color;
        document.querySelectorAll(".swatch").forEach(s => s.classList.remove("active"));
        sw.classList.add("active");
      });
    });
    $("customColorInput").addEventListener("input", (e) => { prefs.color = e.target.value; $("customColorDot").style.background = e.target.value; });
    $("sizeSlider").addEventListener("input", (e) => { prefs.brushSize = parseInt(e.target.value); });

    $("glowOnBtn").addEventListener("click", () => {
      video.style.filter = "contrast(1.15) saturate(1.25) brightness(1.05)";
      $("glowOnBtn").classList.add("active"); $("glowOffBtn").classList.remove("active");
      showToast("HDR Glow Enabled");
    });
    $("glowOffBtn").addEventListener("click", () => {
      video.style.filter = "none";
      $("glowOffBtn").classList.add("active"); $("glowOnBtn").classList.remove("active");
      showToast("Standard Camera");
    });

    $("snapOnBtn").addEventListener("click", () => {
      prefs.smartShape = true;
      $("snapOnBtn").classList.add("active"); $("snapOffBtn").classList.remove("active");
      showToast("Smart Shape Enabled");
    });
    $("snapOffBtn").addEventListener("click", () => {
      prefs.smartShape = false;
      $("snapOffBtn").classList.add("active"); $("snapOnBtn").classList.remove("active");
      showToast("Smart Shape Disabled");
    });

    async function startApp() {
      try {
        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm");
        app.handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
          runningMode: "VIDEO", numHands: 1
        });
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        video.srcObject = stream;
        await new Promise((res) => { video.onloadedmetadata = () => { video.play(); res(); }; });
        app.cameraActive = true;
        $("startupModal").classList.add("hidden");
        showToast("System Online");
      } catch (err) {
        $("startupModal").classList.add("hidden");
        showToast("Touch/Mouse Mode Active");
      }
    }
    $("startCamBtn").addEventListener("click", startApp);
  </script>
</body>
</html>
